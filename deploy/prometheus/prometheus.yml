global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: lattice-gateway
    static_configs:
      - targets: ["gateway:8080"]
  - job_name: lattice-router
    static_configs:
      - targets: ["router:8081"]
  - job_name: lattice-scheduler
    static_configs:
      - targets: ["scheduler:8082"]
  - job_name: lattice-registry
    static_configs:
      - targets: ["registry:8083"]
  - job_name: lattice-worker
    static_configs:
      - targets: ["worker:8084", "worker-2:8084"]
  - job_name: lattice-chaos
    static_configs:
      - targets: ["chaos:8085"]
