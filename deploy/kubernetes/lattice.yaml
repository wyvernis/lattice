apiVersion: v1
kind: Namespace
metadata:
  name: lattice
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: lattice-config
  namespace: lattice
data:
  CLUSTER_NAME: "k8s"
  API_KEYS: "lattice-dev-key"
  JWT_SECRET: "lattice-dev-secret-change-me"
  NATS_URL: "nats://nats:4222"
  REDIS_URL: "redis://redis:6379"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: lattice
spec:
  replicas: 2
  selector:
    matchLabels: { app: gateway }
  template:
    metadata:
      labels: { app: gateway }
    spec:
      containers:
        - name: gateway
          image: lattice/gateway:latest
          ports: [{ containerPort: 8080 }]
          envFrom: [{ configMapRef: { name: lattice-config } }]
          env:
            - { name: HTTP_ADDR, value: ":8080" }
            - { name: ROUTER_URL, value: "http://router:8081" }
            - { name: SCHEDULER_URL, value: "http://scheduler:8082" }
            - { name: REGISTRY_URL, value: "http://registry:8083" }
          readinessProbe:
            httpGet: { path: /readyz, port: 8080 }
            initialDelaySeconds: 3
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: lattice
spec:
  type: LoadBalancer
  selector: { app: gateway }
  ports: [{ port: 80, targetPort: 8080 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: router
  namespace: lattice
spec:
  replicas: 2
  selector:
    matchLabels: { app: router }
  template:
    metadata:
      labels: { app: router }
    spec:
      containers:
        - name: router
          image: lattice/router:latest
          ports: [{ containerPort: 8081 }]
          envFrom: [{ configMapRef: { name: lattice-config } }]
          env:
            - { name: HTTP_ADDR, value: ":8081" }
---
apiVersion: v1
kind: Service
metadata:
  name: router
  namespace: lattice
spec:
  selector: { app: router }
  ports: [{ port: 8081, targetPort: 8081 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scheduler
  namespace: lattice
spec:
  replicas: 1
  selector:
    matchLabels: { app: scheduler }
  template:
    metadata:
      labels: { app: scheduler }
    spec:
      containers:
        - name: scheduler
          image: lattice/scheduler:latest
          ports: [{ containerPort: 8082 }]
          envFrom: [{ configMapRef: { name: lattice-config } }]
          env:
            - { name: HTTP_ADDR, value: ":8082" }
---
apiVersion: v1
kind: Service
metadata:
  name: scheduler
  namespace: lattice
spec:
  selector: { app: scheduler }
  ports: [{ port: 8082, targetPort: 8082 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: registry
  namespace: lattice
spec:
  replicas: 1
  selector:
    matchLabels: { app: registry }
  template:
    metadata:
      labels: { app: registry }
    spec:
      containers:
        - name: registry
          image: lattice/registry:latest
          ports: [{ containerPort: 8083 }]
          envFrom: [{ configMapRef: { name: lattice-config } }]
          env:
            - { name: HTTP_ADDR, value: ":8083" }
---
apiVersion: v1
kind: Service
metadata:
  name: registry
  namespace: lattice
spec:
  selector: { app: registry }
  ports: [{ port: 8083, targetPort: 8083 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: lattice
spec:
  replicas: 2
  selector:
    matchLabels: { app: worker }
  template:
    metadata:
      labels: { app: worker }
    spec:
      containers:
        - name: worker
          image: lattice/worker:latest
          ports: [{ containerPort: 8084 }]
          envFrom: [{ configMapRef: { name: lattice-config } }]
          env:
            - { name: HTTP_ADDR, value: ":8084" }
            - { name: SCHEDULER_URL, value: "http://scheduler:8082" }
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: NODE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
---
apiVersion: v1
kind: Service
metadata:
  name: worker
  namespace: lattice
spec:
  clusterIP: None
  selector: { app: worker }
  ports: [{ port: 8084, targetPort: 8084 }]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: worker-hpa
  namespace: lattice
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: worker
  minReplicas: 2
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
---
# KEDA ScaledObject for queue-depth driven scaling
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: worker-keda
  namespace: lattice
spec:
  scaleTargetRef:
    name: worker
  minReplicaCount: 2
  maxReplicaCount: 50
  triggers:
    - type: prometheus
      metadata:
        serverAddress: http://prometheus:9090
        metricName: lattice_queue_depth
        query: sum(lattice_queue_depth)
        threshold: "10"
